<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Example outcomes after thyroid surgery poster</title>
  <desc id="desc">A clearly labelled academic poster preview with sample layout blocks and no clinical claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfa"/><stop offset="1" stop-color="#e7f2ef"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d7775"/><stop offset="1" stop-color="#14535b"/></linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <path d="M760 0h240v240L880 120z" fill="#d8ebe7"/>
  <rect x="62" y="56" width="876" height="48" rx="24" fill="#c9824b"/>
  <text x="500" y="88" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">EXAMPLE POSTER · LAYOUT PREVIEW</text>
  <text x="500" y="166" text-anchor="middle" fill="#123d45" font-family="Arial,sans-serif" font-size="48" font-weight="700">Outcomes After Thyroid Surgery</text>
  <text x="500" y="207" text-anchor="middle" fill="#54706f" font-family="Arial,sans-serif" font-size="22">Replace this placeholder with your next published study</text>
  <rect x="62" y="248" width="876" height="84" rx="15" fill="#fff" stroke="#cbdedb"/>
  <text x="92" y="282" fill="#0d7775" font-family="Arial,sans-serif" font-size="20" font-weight="700">PURPOSE OF THIS EXAMPLE</text>
  <text x="92" y="311" fill="#405b5a" font-family="Arial,sans-serif" font-size="18">Preview the collection grid, detail page, and admin-written text.</text>
  <rect x="62" y="366" width="410" height="244" rx="18" fill="#fff" stroke="#cbdedb"/>
  <text x="92" y="407" fill="#123d45" font-family="Arial,sans-serif" font-size="25" font-weight="700">Study design</text>
  <circle cx="154" cy="480" r="43" fill="#d9efeb"/><path d="M154 450v60M124 480h60" stroke="#0d7775" stroke-width="12" stroke-linecap="round"/>
  <rect x="222" y="449" width="198" height="16" rx="8" fill="#d8e5e2"/><rect x="222" y="480" width="158" height="16" rx="8" fill="#d8e5e2"/><rect x="222" y="511" width="181" height="16" rx="8" fill="#d8e5e2"/>
  <text x="92" y="574" fill="#6c7e7c" font-family="Arial,sans-serif" font-size="17">Your methodology and cohort summary</text>
  <rect x="500" y="366" width="438" height="244" rx="18" fill="url(#accent)"/>
  <text x="532" y="407" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Key findings</text>
  <text x="532" y="486" fill="#fff" font-family="Arial,sans-serif" font-size="78" font-weight="700">00</text>
  <text x="650" y="467" fill="#bce4dd" font-family="Arial,sans-serif" font-size="18">YOUR PRIMARY</text><text x="650" y="493" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">RESULT HERE</text>
  <text x="532" y="572" fill="#d8eeea" font-family="Arial,sans-serif" font-size="17">Add real findings through the admin page</text>
  <rect x="62" y="642" width="876" height="250" rx="18" fill="#fff" stroke="#cbdedb"/>
  <text x="92" y="686" fill="#123d45" font-family="Arial,sans-serif" font-size="25" font-weight="700">Visual summary</text>
  <rect x="104" y="746" width="104" height="100" rx="10" fill="#d9efeb"/><rect x="246" y="716" width="104" height="130" rx="10" fill="#9fd3c9"/><rect x="388" y="686" width="104" height="160" rx="10" fill="#0d7775"/>
  <path d="M566 809l72-61 72 32 114-83" fill="none" stroke="#c9824b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="566" cy="809" r="10" fill="#c9824b"/><circle cx="638" cy="748" r="10" fill="#c9824b"/><circle cx="710" cy="780" r="10" fill="#c9824b"/><circle cx="824" cy="697" r="10" fill="#c9824b"/>
  <text x="500" y="952" text-anchor="middle" fill="#58706e" font-family="Arial,sans-serif" font-size="18">Smart Surgical Team · Replace or remove in Admin → Posters</text>
</svg>
