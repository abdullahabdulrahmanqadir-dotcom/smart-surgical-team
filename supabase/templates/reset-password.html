<!-- Supabase → Authentication → Emails → "Reset password".
     The site's /forget-password flow expects a link, not a code:
     PasswordRecoveryForm reads the recovery session Supabase puts in the URL.
     Keep {{ .ConfirmationURL }} as the primary action here. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:32px 0;background:#f4f7f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e3eae9;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="padding:28px 32px 0;">
            <p style="margin:0;color:#167a78;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Smart Surgical Team</p>
            <h1 style="margin:12px 0 0;color:#0d3838;font-size:26px;font-weight:700;line-height:1.25;">Reset your password</h1>
            <p style="margin:12px 0 0;color:#4a5c5b;font-size:15px;line-height:1.6;">Use the button below to choose a new password. The link works once and expires in one hour.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;">
            <a href="{{ .ConfirmationURL }}" style="display:block;padding:14px 20px;background:#167a78;border-radius:10px;color:#ffffff;font-size:15px;font-weight:700;text-align:center;text-decoration:none;">Choose a new password</a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 28px;">
            <p style="margin:0;color:#71817f;font-size:13px;line-height:1.6;">If you did not ask for this, ignore this email — your password stays as it is.</p>
          </td>
        </tr>
      </table>
      <p style="margin:20px 0 0;color:#8b9998;font-size:12px;">Smart Surgical Team · ssthyroid.com</p>
    </td>
  </tr>
</table>
